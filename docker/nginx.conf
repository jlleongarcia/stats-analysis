server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NOTE: do not add a `types { ... }` block at server level. In nginx a
    # `types` directive *replaces* the inherited map rather than extending it,
    # so it would discard /etc/nginx/mime.types and serve every file
    # (index.html and sw.js included) as application/octet-stream. To add a
    # single type, set default_type in a location instead — see .mjs below.

    # SPA history fallback (the app itself uses hash routing, but keep this safe).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # nginx's default mime.types has no entry for .mjs, so it would fall through
    # to application/octet-stream — and browsers reject an ES module served with
    # a non-JavaScript type. This is how pyodide.mjs gets imported at all.
    location ~ \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vendored Pyodide runtime: wasm, stdlib and wheels, immutable per release.
    location /pyodide/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The stats_core wheel: rebuilt with the app, so a shorter life than the above.
    location /pyodide-packages/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache the service worker or the shell.
    location = /sw.js      { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # Only the text-ish assets: the wheels and the zip are already compressed.
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
}

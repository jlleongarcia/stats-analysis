server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback (the app itself uses hash routing, but keep this safe).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Pyodide wheel: long-lived, immutable per build.
    location /pyodide-packages/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache the service worker or the shell.
    location = /sw.js            { add_header Cache-Control "no-cache"; }
    location = /registerSW.js    { add_header Cache-Control "no-cache"; }
    location = /index.html       { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { } default_type application/manifest+json; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # WASM needs the right MIME type for streaming compilation.
    types { application/wasm wasm; }
}

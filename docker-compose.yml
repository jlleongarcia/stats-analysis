# Two ways to run the app (both on http://localhost:7100):
#   docker compose up web              -> production build, nginx
#   docker compose --profile dev up dev -> Vite dev server with HMR
#
# Everything is computed client-side (Pyodide), so there is no backend service.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: stats-analysis:latest
    ports:
      - "7100:80"
    restart: unless-stopped

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-base
    working_dir: /app/frontend
    entrypoint: ["sh", "/app/scripts/dev-entrypoint.sh"]
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "7100"]
    environment:
      SKIP_WHEEL_BUILD: "1"
    ports:
      - "7100:7100"
    volumes:
      - ./frontend:/app/frontend
      - ./scripts:/app/scripts
      - /app/frontend/node_modules
    profiles: ["dev"]
